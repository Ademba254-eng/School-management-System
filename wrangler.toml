# Worker configuration for Cloudflare Workers (wrangler.toml)
# Place this file at the repository root: Ademba254-eng/School-management-System/wrangler.toml
# Replace placeholders (account_id, database_id) with your real values before deploying.

# Public name of the Worker used when deploying
name = "shule-central-worker"

# Module entry point for your Worker. Change to "src/index.ts" if you use TypeScript.
main = "src/index.js"

# Compatibility date pins runtime behavior to features available on this date (YYYY-MM-DD)
compatibility_date = "2026-10-19"

# Runtime compatibility flags. "nodejs_compat" enables Node.js-compatible APIs where available.
compatibility_flags = ["nodejs_compat"]

# (Optional) Your Cloudflare account ID. Uncomment and set if you want it stored here.
# account_id = "your-account-id-here"

# D1 database bindings. Use one [[d1_databases]] block per database binding.
[[d1_databases]]
binding = "DB"                                  # Environment variable available to the Worker code (e.g. env.DB)
database_name = "shule101"                      # Human-readable name of the D1 database in the Cloudflare dashboard
database_id = "6aa6f1bf-b432-4a33-xxxx-xxxxxxxxxxxx"  # REPLACE with your full D1 UUID

# Notes:
# - The `main` path is resolved relative to the directory containing this wrangler.toml file.
#   Make sure `src/index.js` exists at the repository root level under ./src/index.js.
# - To deploy:
#     1) Install Wrangler (npm install -g wrangler) or use the Cloudflare CLI recommended for your environment.
#     2) Authenticate: `wrangler login` (or `wrangler whoami` to verify)
#     3) From the repo root: `wrangler deploy` (or `wrangler publish` depending on your wrangler version)
# - For multiple environments (staging/production) add [env.staging] and [env.production] sections with overrides.
